server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: newtonite-ops-backend

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/newtonite_ops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

logging:
  level:
    com.newtonite.ops: INFO
    org.springframework.security: WARN
